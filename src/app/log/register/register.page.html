<ion-content class="register-page">
  <div class="logo-container">
    <img src="assets/Babylog.png" alt="BabyLog Logo" class="logo" />
    <h1>Crear cuenta</h1>
    <p>Registra tu perfil para comenzar a usar BabyLog</p>
  </div>

  <ion-card>
    <ion-card-content>
      <ion-item>
        <ion-input placeholder="Nombre completo" [(ngModel)]="name"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input type="email" placeholder="Correo electrónico" [(ngModel)]="email"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input type="password" placeholder="Contraseña" [(ngModel)]="password"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input type="password" placeholder="Confirmar contraseña" [(ngModel)]="confirmPassword"></ion-input>
      </ion-item>

      <ion-button expand="block" color="primary" (click)="register()">Crear cuenta</ion-button>

      <div class="links">
        <a (click)="goToLogin()">¿Ya tienes una cuenta? Inicia sesión</a>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
