<ion-content class="forgot-password-page">
  <div class="logo-container">
    <img src="assets/Babylog.png" alt="BabyLog Logo" class="logo" />
    <h1>Recuperar contraseña</h1>
    <p>Te enviaremos un enlace para restablecer tu contraseña</p>
  </div>

  <ion-card>
    <ion-card-content>
      <ion-item>
        <ion-input
          type="email"
          placeholder="Correo electrónico"
          [(ngModel)]="email"
        ></ion-input>
      </ion-item>

      <ion-button expand="block" color="primary" (click)="recoverPassword()">
        Enviar enlace
      </ion-button>

      <div class="links">
        <a (click)="goToLogin()">Volver al inicio de sesión</a>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
