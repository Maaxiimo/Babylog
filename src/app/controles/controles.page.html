<ion-header translucent="true">
  <ion-toolbar color="light">
    <ion-title>📋 Controles Médicos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="controles-bg" fullscreen>
  <div class="container">
    <ion-card class="proximo-control">
      <ion-card-header>
        <ion-card-title>🩺 Próximo Control</ion-card-title>
      </ion-card-header>
      <ion-card-content *ngFor="let c of proximos">
        <p><strong>Fecha:</strong> {{ c.fecha }}</p>
        <p><strong>Tipo:</strong> {{ c.tipo }}</p>
        <p><strong>Lugar:</strong> {{ c.lugar }}</p>
        <ion-badge color="warning">{{ c.estado }}</ion-badge>
      </ion-card-content>
    </ion-card>

    <ion-card class="historial">
      <ion-card-header>
        <ion-card-title>📆 Controles Anteriores</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-list>
          <ion-item *ngFor="let h of anteriores">
            <ion-label>
              <h2>{{ h.fecha }}</h2>
              <p><strong>{{ h.tipo }}</strong></p>
              <p>{{ h.observaciones }}</p>
            </ion-label>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
